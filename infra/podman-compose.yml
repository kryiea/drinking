services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}
    container_name: yinzhi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yinzhi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yinzhi}
      POSTGRES_DB: ${POSTGRES_DB:-yinzhi}
    ports:
      - "5432:5432"
    volumes:
      - yinzhi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yinzhi} -d ${POSTGRES_DB:-yinzhi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    container_name: yinzhi-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - yinzhi-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-docker.io/minio/minio:latest}
    container_name: yinzhi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yinzhi-minio-data:/data
volumes:
  yinzhi-postgres-data:
  yinzhi-redis-data:
  yinzhi-minio-data:
