name: Yinzhi
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: Yinzhi
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
targets:
  Yinzhi:
    type: application
    platform: iOS
    sources:
      - Yinzhi
    info:
      path: Yinzhi/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luca.yinzhi
        INFOPLIST_KEY_CFBundleDisplayName: 饮知
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_YINZHI_API_BASE_URL: http://127.0.0.1:8000
        INFOPLIST_KEY_YINZHI_DEVELOPMENT_TOKEN_SEED: yinzhi-local-dev
        INFOPLIST_KEY_YINZHI_DEVICE_NAME: ""
        INFOPLIST_KEY_YINZHI_ENABLE_PREVIEW_FALLBACK: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  YinzhiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YinzhiTests
    dependencies:
      - target: Yinzhi
